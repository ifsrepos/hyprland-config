# ============================================================
# Hyprland keybindings
# Vim-style navigation with Super as the main modifier
# ============================================================


# ------------------------------------------------------------
# Applications
# ------------------------------------------------------------

# Wi-Fi menu
bind = SUPER, W, exec, ~/.local/bin/rofi-wifi

# Bluetooth menu
bind = SUPER, B, exec, ~/.local/bin/rofi-bluetooth

# Terminal
bind = SUPER, RETURN, exec, $terminal

# Application launcher
bind = SUPER, SPACE, exec, rofi -show drun

# Lock screen
bind = SUPER, SUPR, exec, hyprlock

# Exit Hyprland
bind = SUPER, ESCAPE, exit

# Flameshot
bind = , Print, exec, XDG_CURRENT_DESKTOP=Sway flameshot gui

# ------------------------------------------------------------
# Window focus — Vim style
# ------------------------------------------------------------

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r


# ------------------------------------------------------------
# Move windows — Vim style
# ------------------------------------------------------------

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r


# ------------------------------------------------------------
# Resize windows — Vim style
# ------------------------------------------------------------

binde = SUPER CTRL, H, resizeactive, -50 0
binde = SUPER CTRL, L, resizeactive, 50 0
binde = SUPER CTRL, K, resizeactive, 0 -50
binde = SUPER CTRL, J, resizeactive, 0 50


# ------------------------------------------------------------
# Window management
# ------------------------------------------------------------

# Close active window
bind = SUPER, Q, killactive

# Toggle fullscreen
bind = SUPER, F, fullscreen

# Toggle floating
bind = SUPER, V, togglefloating


# ------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------

# Switch workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9


# ------------------------------------------------------------
# Move active window to workspace
# ------------------------------------------------------------

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9


# ------------------------------------------------------------
# Move active window to workspace and follow it
# ------------------------------------------------------------

bind = SUPER CTRL, 1, movetoworkspacesilent, 1
bind = SUPER CTRL, 2, movetoworkspacesilent, 2
bind = SUPER CTRL, 3, movetoworkspacesilent, 3
bind = SUPER CTRL, 4, movetoworkspacesilent, 4
bind = SUPER CTRL, 5, movetoworkspacesilent, 5
bind = SUPER CTRL, 6, movetoworkspacesilent, 6
bind = SUPER CTRL, 7, movetoworkspacesilent, 7
bind = SUPER CTRL, 8, movetoworkspacesilent, 8
bind = SUPER CTRL, 9, movetoworkspacesilent, 9


# ------------------------------------------------------------
# Cycle through windows
# ------------------------------------------------------------

bind = SUPER, TAB, cyclenext
bind = SUPER SHIFT, TAB, cyclenext, prev


# ------------------------------------------------------------
# Audio
# ------------------------------------------------------------

# Volume up/down, repeat while held
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Mute
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
